name: Update card database

on:
  schedule:
    - cron: "15 18 * * *"
  workflow_dispatch:
    inputs:
      series:
        description: "latest, all, official series ID, or product code"
        required: false
        default: "latest"
        type: string
      download_images:
        description: "Download card images into CardsWebP"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-union-arena-cards
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -r requirements.txt

      - name: Synchronize official card data
        shell: bash
        run: |
          ARGS=(--series "${{ inputs.series || 'latest' }}")
          DOWNLOAD_IMAGES="${{ inputs.download_images }}"
          if [[ "${{ github.event_name }}" == "schedule" || "$DOWNLOAD_IMAGES" == "true" || "$DOWNLOAD_IMAGES" == "" ]]; then
            ARGS+=(--download-images)
          fi
          python scripts/sync_cards.py "${ARGS[@]}"
          python scripts/sync_faq.py --series matching

      - name: Commit changes
        id: commit
        shell: bash
        run: |
          if [[ -z "$(git status --short)" ]]; then
            echo "No changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards.json
          if [[ -d CardsWebP ]]; then
            git add CardsWebP
          fi
          git commit -m "Update UNION ARENA card data"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Configure Pages
        if: steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
